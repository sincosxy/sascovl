<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Уведомления</h1>

    {% if notifications %}
    <ul class="space-y-2">
        {% for n in notifications %}
        <li class="bg-white rounded-xl border p-4 shadow-sm flex items-start gap-3
                   {{ 'border-gray-200' if n.is_read else 'border-blue-300 bg-blue-50/40' }}">
            <span class="mt-1.5 w-2 h-2 rounded-full shrink-0 {{ 'bg-transparent' if n.is_read else 'bg-blue-500' }}"></span>
            <div class="min-w-0 flex-1">
                <div class="text-sm text-gray-800 break-words">{{ n.text }}</div>
                <div class="mt-1 flex items-center gap-3 text-xs text-gray-400">
                    <span>{{ n.created_at|vlad_time }}</span>
                    {% if not n.is_read %}<span class="text-blue-600 font-semibold">новое</span>{% endif %}
                    {% if n.order_id %}
                        <button hx-get="{{ '/api/operator/orders/%d/manage' % n.order_id if staff else '/api/orders/%d/summary' % n.order_id }}" hx-target="#main-content"
                                class="text-blue-600 hover:underline cursor-pointer">Открыть заявку №{{ n.order_id }}</button>
                    {% endif %}
                </div>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
        <div class="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400 text-sm">
            Уведомлений пока нет
        </div>
    {% endif %}
</div>
